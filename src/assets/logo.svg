<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer glowing rings -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.5"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  
  <!-- Shield Background -->
  <path d="M 50 15 Q 72 15 76 42 Q 76 70 50 88 Q 24 70 24 42 Q 28 15 50 15 Z" fill="#053E26" stroke="#D4AF37" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- DeMolay Crown in Gold -->
  <path d="M 36 38 L 41 50 L 50 41 L 59 50 L 64 38 L 58 43 L 50 32 L 42 43 Z" fill="#D4AF37" stroke="#755819" stroke-width="0.75"/>
  
  <!-- Crown Jewels (Dots) -->
  <circle cx="36" cy="36" r="1" fill="#fff"/>
  <circle cx="50" cy="30" r="1.2" fill="#fff"/>
  <circle cx="64" cy="36" r="1" fill="#fff"/>
  
  <!-- Star in Center -->
  <polygon points="50,50 52,56 58,56 53,60 55,66 50,62 45,66 47,60 42,56 48,56" fill="#D4AF37" stroke="#755819" stroke-width="0.5"/>
  
  <!-- Crossed Swords (Symbol of Protection & Chivalry) -->
  <path d="M 33 67 L 42 58 M 67 67 L 58 58" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <circle cx="31" cy="69" r="2" fill="#D4AF37"/>
  <circle cx="69" cy="69" r="2" fill="#D4AF37"/>
  
  <!-- Flanking Laurel Wreath (Dotted Gold Ribbon) -->
  <path d="M 28 45 Q 20 62 35 77 Q 50 85 65 77 Q 80 62 72 45" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2 3"/>
  
  <!-- Year Text -->
  <text x="50" y="80" font-family="'Playfair Display', serif" font-size="6" font-weight="bold" fill="#D4AF37" text-anchor="middle" letter-spacing="0.5">1919</text>
</svg>
